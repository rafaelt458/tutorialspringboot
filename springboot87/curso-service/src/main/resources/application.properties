spring.application.name=curso-service

# eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
server.port=0
eureka.instance.instance-id=${spring.application.name}:${random.uuid}
# Evita conflicto cuando se ejecutan múltiples instancias en la misma máquina
eureka.instance.prefer-ip-address=true

spring.mongodb.uri=mongodb://admin:1234@192.168.1.71:27017/coursedb?authSource=admin

# Configuracion actuator
management.endpoints.web.exposure.include=health,beans,metrics,info,env
management.endpoint.health.show-details=always

# =========
#  RABBITMQ
# =========
spring.rabbitmq.host=192.168.1.71
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=1234

# Mapea los exchanges RabbitMQ donde se reciben los eventos
spring.cloud.stream.bindings.matriculaCreadaEventConsumer-in-0.destination=matricula-creada-exchange

# Define qué beans son funciones que Spring Cloud Stream debe procesar
spring.cloud.function.definition=matriculaCreadaEventConsumer
