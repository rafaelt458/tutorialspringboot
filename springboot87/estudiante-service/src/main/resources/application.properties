spring.application.name=estudiante-service

# eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
server.port=0
eureka.instance.instance-id=${spring.application.name}:${random.uuid}
# Evita conflicto cuando se ejecutan múltiples instancias en la misma máquina
eureka.instance.prefer-ip-address=true

# SQL Server Configuration
spring.datasource.url=jdbc:sqlserver://192.168.1.71:1433;databaseName=estudiantesdb;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=LabRafa_1234

# Configuracion de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Configuracion actuator
management.endpoints.web.exposure.include=health,beans,metrics,info,env
management.endpoint.health.show-details=always