spring.application.name=gateway-service

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
server.port=8081
eureka.instance.instance-id=${spring.application.name}:${random.uuid}

eureka.client.fetch-registry=true
eureka.client.register-with-eureka=false

# Configuracion Spring Cloud Gateway
spring.cloud.gateway.server.webmvc.routes[0].id=estudiante-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://estudiante-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/estudiantes/**
# spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/estudiantes/**,Method=GET
# spring.cloud.gateway.server.webmvc.routes[0].filters[0]=AddRequestHeader=X-Gateway,true
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=AddResponseHeader=X-Version,1.0

spring.cloud.gateway.server.webmvc.routes[1].id=curso-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://curso-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/cursos/**

spring.cloud.gateway.server.webmvc.routes[2].id=matricula-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://matricula-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/matriculas/**

# Configuracion actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always