spring.application.name=matricula-service

server.port=8092

# ============================
#  DATABASE (MySQL)
# ============================
spring.datasource.url=jdbc:mysql://192.168.1.71:3306/matriculadb?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234

# Configuracion de JPA/Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================
#  OPENFEIGN
# ============================
feign.client.config.default.connect-timeout=3000
feign.client.config.default.read-timeout=5000

estudiante-service.url=http://localhost:8090
curso-service.url=http://localhost:8091
