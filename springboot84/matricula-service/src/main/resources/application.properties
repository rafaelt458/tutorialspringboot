spring.application.name=matricula-service

server.port=8092

# ============================
#  DATABASE (MySQL)
# ============================
spring.datasource.url=jdbc:mysql://192.168.1.71:3306/matriculadb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234

# Configuracion de JPA/Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================
#  OPENFEIGN
# ============================
feign.client.config.default.connect-timeout=3000
feign.client.config.default.read-timeout=5000

estudiante-service.url=http://localhost:8090
curso-service.url=http://localhost:8091

# ============================
#  ACTUATOR
# ============================
management.endpoints.web.exposure.include=health,info,ratelimiters,ratelimiterevents
management.endpoint.health.show-details=always

# ============================
#  RESILIENCE4J
# ============================
resilience4j.ratelimiter.instances.matriculaRateLimiter.limitForPeriod=3
resilience4j.ratelimiter.instances.matriculaRateLimiter.limitRefreshPeriod=1s

resilience4j.ratelimiter.instances.matriculaRateLimiter.allow-health-indicator-to-fail=true
resilience4j.ratelimiter.instances.matriculaRateLimiter.subscribe-for-events=true
resilience4j.ratelimiter.instances.matriculaRateLimiter.event-consumer-buffer-size=50
