spring.application.name=matricula-service

server.port=8092

# ============================
#  DATABASE (MySQL)
# ============================
spring.datasource.url=jdbc:mysql://192.168.1.71:3306/matriculadb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234

# Configuracion de JPA/Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================
#  OPENFEIGN
# ============================
feign.client.config.default.connect-timeout=3000
feign.client.config.default.read-timeout=5000

estudiante-service.url=http://localhost:8090
curso-service.url=http://localhost:8091

# ============================
#  ACTUATOR
# ============================
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,ratelimiters,ratelimiterevents
management.endpoint.health.show-details=always

# ============================
#  RESILIENCE4J
# ============================

# Circuit Braker

# Porcentaje de fallos para que el Circuit Breaker pase de CLOSED a OPEN.
resilience4j.circuitbreaker.instances.getStudentCB.failureRateThreshold=50
# Llamadas a tener en cuenta para calcular el porcentaje de fallos
resilience4j.circuitbreaker.instances.getStudentCB.slidingWindowSize=10
# Minimo numero de llamadas a tener en cuenta para calcular el porcentaje de fallos
resilience4j.circuitbreaker.instances.getStudentCB.minimumNumberOfCalls=10
# Numero de segundos durante el cual el circuito permanece abierto antes de comprobar el servicio
resilience4j.circuitbreaker.instances.getStudentCB.waitDurationInOpenState=5s
# Numero de llamadas de prueba permitidas en estado HALF_OPEN
resilience4j.circuitbreaker.instances.getStudentCB.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.getStudentCB.ignoreExceptions=feign.FeignException$NotFound

resilience4j.circuitbreaker.instances.getCourseCB.failureRateThreshold=50
resilience4j.circuitbreaker.instances.getCourseCB.slidingWindowSize=10
resilience4j.circuitbreaker.instances.getCourseCB.minimumNumberOfCalls=10
resilience4j.circuitbreaker.instances.getCourseCB.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.getCourseCB.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.getCourseCB.ignoreExceptions=feign.FeignException$NotFound

# Retry

resilience4j.retry.instances.getStudentRetry.maxAttempts=3
resilience4j.retry.instances.getStudentRetry.waitDuration=1s
resilience4j.retry.instances.getStudentRetry.retryExceptions=feign.RetryableException,java.net.ConnectException,java.net.SocketTimeoutException
# resilience4j.retry.instances.getStudentRetry.ignoreExceptions=com.laboratorio.framework.exception.ResourceNotFoundException

resilience4j.retry.instances.getCourseRetry.maxAttempts=3
resilience4j.retry.instances.getCourseRetry.waitDuration=2s
resilience4j.retry.instances.getCourseRetry.retryExceptions=feign.RetryableException,java.net.ConnectException,java.net.SocketTimeoutException
# resilience4j.retry.instances.getCourseRetry.ignoreExceptions=com.laboratorio.framework.exception.ResourceNotFoundException

# Rate Limiter

resilience4j.ratelimiter.instances.matriculaRateLimiter.limitForPeriod=3
resilience4j.ratelimiter.instances.matriculaRateLimiter.limitRefreshPeriod=1s

resilience4j.ratelimiter.instances.matriculaRateLimiter.allow-health-indicator-to-fail=true
resilience4j.ratelimiter.instances.matriculaRateLimiter.subscribe-for-events=true
resilience4j.ratelimiter.instances.matriculaRateLimiter.event-consumer-buffer-size=50

# =========
#  RABBITMQ
# =========
spring.rabbitmq.host=192.168.1.71
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=1234

# Mapea los exchanges RabbitMQ donde se reciben los eventos
spring.cloud.stream.bindings.cupoCursoReservadoEventConsumer-in-0.destination=cupo-curso-reservado-exchange
spring.cloud.stream.bindings.cupoCursoRechazadoEventConsumer-in-0.destination=cupo-curso-rechazado-exchange

# Define que beans son funciones que Spring Cloud Stream debe procesar
spring.cloud.function.definition=cupoCursoReservadoEventConsumer;cupoCursoRechazadoEventConsumer
